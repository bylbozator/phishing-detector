<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход в интернет-банк — Демобанк</title>
</head>
<body>
  <h1>Демобанк — вход в личный кабинет</h1>
  <p>Введите логин и пароль, чтобы войти в интернет-банк.</p>
  <!-- Учебная страница: форма отправляет данные на тот же домен,
       это нормальное поведение настоящего сайта. -->
  <form method="post" action="https://demo-bank.example.ru/auth">
    <label>Логин <input type="text" name="login"></label><br>
    <label>Пароль <input type="password" name="password"></label><br>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
